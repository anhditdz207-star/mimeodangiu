<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mimeo Data</title>
<meta name="description" content="Mimeo Data - lưu trữ giao dịch MoMo Postpaid cá nhân">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="video" href="assets/mimeovideo.mp4">
</head>
<body>

<audio id="bgMusic" src="assets/backgroundmusic.mp3" loop preload="auto"></audio>
<audio id="spinSound" src="assets/Spinningsoundeffect.mp3" loop preload="auto"></audio>

<!-- ============ PASSWORD GATE (slot machine lock, shown on top of everything) ============ -->
<div id="gate">
  <div class="title-wrap">
    <span class="star s1">★</span>
    <div class="logo">BINGGO!</div>
    <span class="star s2">★</span>
    <span class="star s3">✦</span>
  </div>
  <div id="machine">
    <div class="panel" id="panel"></div>
    <div class="lever-box" id="leverBox">
      <div class="lever-base">
        <div class="lever-stick"><div class="lever-ball"></div></div>
      </div>
      <div class="lever-hint">PULL</div>
    </div>
  </div>
  <div class="hint-text" id="hintText">Kéo cần gạt để bắt đầu quay 🎰</div>
  <input type="tel" id="hiddenInput" maxlength="8" inputmode="numeric" pattern="[0-9]*">
  <div id="jackpot">JACKPOT!</div>
</div>

<!-- ============ LOADING GATE (shown briefly while Firestore data loads) ============ -->
<div id="setupGate" class="setup-gate">
  <div class="setup-box">
    <p id="setupTitle" class="setup-title">Đang tải dữ liệu...</p>
    <p id="setupError" class="setup-error"></p>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="app hidden">

  <!-- Header -->
  <header class="header">
    <button id="listBtn" class="icon-btn" aria-label="Danh sách">
      <img src="assets/nut-list.png" alt="Danh sách" draggable="false">
    </button>

    <div class="video-frame">
      <video
        id="decoVideo"
        src="assets/mimeovideo.mp4"
        autoplay
        muted
        loop
        playsinline
        disablepictureinpicture
        disableremoteplayback
        controlslist="nodownload noplaybackrate nofullscreen"
        oncontextmenu="return false"
      ></video>
    </div>
  </header>

  <!-- Search -->
  <section class="search-section">
    <input id="searchInput" class="search-input" type="text"
      placeholder="Tìm theo ngày (2026, 07, 07/2026, 26/07, 26/07/2026)"
      autocomplete="off" inputmode="numeric">
  </section>

  <!-- Results -->
  <section id="resultsList" class="results-list"></section>
  <p id="emptyState" class="empty-state hidden">Chưa có giao dịch nào.</p>

  <!-- Floating add button -->
  <button id="addBtn" class="add-btn" aria-label="Thêm giao dịch">
    <img src="assets/nut-them-data.png" alt="Thêm" draggable="false">
  </button>
</div>

<!-- ============ ADD POPUP ============ -->
<div id="popupOverlay" class="popup-overlay hidden">
  <div id="popupCard" class="popup-card">
    <img class="popup-frame" src="assets/khung.png" alt="" draggable="false">

    <button id="popupClose" class="popup-close" aria-label="Đóng">
      <img src="assets/nut-thoat.png" alt="Đóng" draggable="false">
    </button>

    <div class="upload-zone" data-slot="khach" style="left:14.0%; top:25.0%; width:17.3%; height:25.2%;">
      <input type="file" accept="image/*" class="upload-input" data-slot="khach">
      <img class="upload-preview hidden" alt="Khách">
      <span class="upload-plus">+</span>
    </div>
    <div class="upload-zone" data-slot="ban" style="left:42.1%; top:25.0%; width:16.3%; height:25.2%;">
      <input type="file" accept="image/*" class="upload-input" data-slot="ban">
      <img class="upload-preview hidden" alt="Bạn">
      <span class="upload-plus">+</span>
    </div>
    <div class="upload-zone" data-slot="ctv" style="left:68.3%; top:25.0%; width:16.4%; height:25.2%;">
      <input type="file" accept="image/*" class="upload-input" data-slot="ctv">
      <img class="upload-preview hidden" alt="CTV">
      <span class="upload-plus">+</span>
    </div>

    <button id="saveBtn" class="popup-save" disabled>
      <img src="assets/nut-luu-tru.png" alt="Lưu trữ" draggable="false">
    </button>
  </div>
</div>

<!-- ============ SIDEBAR (list explorer) ============ -->
<div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span>Thư mục</span>
    <button id="sidebarClose" class="sidebar-close">&times;</button>
  </div>
  <div id="sidebarTree" class="sidebar-tree"></div>
</aside>

<!-- ============ TRANSACTION VIEWER ============ -->
<div id="viewerOverlay" class="viewer-overlay hidden">
  <div class="viewer-card">
    <button id="viewerClose" class="popup-close" aria-label="Đóng">
      <img src="assets/nut-thoat.png" alt="Đóng" draggable="false">
    </button>
    <div id="viewerDate" class="viewer-date"></div>
    <div class="viewer-block">
      <p class="viewer-label">Khách</p>
      <img id="viewerKhach" class="viewer-img" alt="Khách">
    </div>
    <div class="viewer-block">
      <p class="viewer-label">Bạn</p>
      <img id="viewerBan" class="viewer-img" alt="Bạn">
    </div>
    <div id="viewerCtvBlock" class="viewer-block">
      <p class="viewer-label">CTV</p>
      <img id="viewerCtv" class="viewer-img" alt="CTV">
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/gate.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloudinary.js"></script>
<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
